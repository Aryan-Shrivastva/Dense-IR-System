<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header>
  <h1>Analytics</h1>
  <a href="index.html">Search</a>
</header>

<div class="dashboard-grid">
  <div class="metric-card">
    <div class="metric-label">Searches</div>
    <div class="metric-val" id="d-searches">--</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Clicks</div>
    <div class="metric-val" id="d-clicks">--</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Avg Alpha</div>
    <div class="metric-val" id="d-alpha">--</div>
  </div>
  <div class="metric-card">
    <div class="metric-label">Avg Latency</div>
    <div class="metric-val" id="d-latency">--</div>
  </div>
</div>

<div class="charts-grid">
  <div class="chart-card">
    <h3>ColBERT Score Distribution</h3>
    <p>MaxSim scores for last query</p>
    <div style="height:180px;position:relative"><canvas id="scoreChart"></canvas></div>
  </div>
  <div class="chart-card">
    <h3>Alpha Blend</h3>
    <p>Semantic vs user weight</p>
    <div style="height:180px;position:relative"><canvas id="blendChart"></canvas></div>
  </div>
  <div class="chart-card full">
    <h3>Semantic vs Hybrid Scores</h3>
    <p>Per-result comparison</p>
    <div style="height:200px;position:relative"><canvas id="rankChart"></canvas></div>
  </div>
  <div class="chart-card">
    <h3>Query Token Weights</h3>
    <p>ColBERT MaxSim per token</p>
    <div id="token-grid" class="token-grid"></div>
  </div>
  <div class="chart-card">
    <h3>Top Queries</h3>
    <p>Most frequent searches</p>
    <div id="top-queries"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
