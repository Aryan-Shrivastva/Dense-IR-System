<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IR Search</title>
<link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
<header>
  <h1>IR System</h1>
  <a href="dashboard.html">Dashboard</a>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="card">
      <span class="label">User</span>
      <select id="user-select">
        <option value="anonymous">New user</option>
        <option value="tech_user">Tech user</option>
        <option value="science_user">Science user</option>
        <option value="medical_user">Medical user</option>
      </select>

      <span class="label" style="margin-top:12px">Method</span>
      <div class="method-btns">
        <button class="method-btn" data-method="bm25">BM25</button>
        <button class="method-btn" data-method="dense">Dense</button>
        <button class="method-btn active" data-method="hybrid">Hybrid</button>
      </div>

      <span class="label" style="margin-top:12px">Results</span>
      <select id="topk-select">
        <option value="5">5</option>
        <option value="10" selected>10</option>
        <option value="20">20</option>
      </select>
    </div>

    <div class="card" id="pipeline-card" style="display:none">
      <span class="label">Pipeline</span>
      <div class="pipeline-row"><span class="stage-label">Stage 1</span><span class="stage-val" id="s1-count">--</span></div>
      <div class="pipeline-row"><span class="stage-label">Stage 2</span><span class="stage-val" id="s2-count">--</span></div>
      <div class="pipeline-row"><span class="stage-label">Latency</span><span class="stage-val" id="latency-val">--</span></div>
    </div>

    <div class="card" id="profile-card">
      <span class="label">Profile</span>
      <div id="profile-info" style="font-size:12px;color:var(--muted)">No clicks yet</div>
    </div>
  </div>

  <div class="main">
    <div class="search-bar">
      <input id="query-input" type="text" placeholder="Enter query..." />
      <button id="search-btn" onclick="doSearch()">Search</button>
    </div>
    <div id="status" class="status"></div>
    <div id="results"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/search.js"></script>
</body>
</html>
